name: CI
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
jobs:
  build-linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      configuration: Release

  build-linux-avx512:
    uses: ./.github/workflows/linux-build-avx512.yml
    with:
      configuration: Release

  build-windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      configuration: Release