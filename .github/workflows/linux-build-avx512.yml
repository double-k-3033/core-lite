name: QubicCoreLite-Linux-AVX512

on:
  workflow_call:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "RelWithDebInfo"
        type: string
      build_dir:
        description: "Build directory"
        required: false
        default: "build"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install CMake and dependencies
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh; chmod +x llvm.sh; sudo ./llvm.sh 18;
          sudo apt install -y clang cmake nasm
          sudo apt install -y libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev zlib1g-dev libzstd-dev g++ libstdc++-12-dev libfmt-dev liblzo2-dev liblz4-dev libc-ares-dev

      # Configure the project with AVX-512 enabled
      - name: Configure with CMake
        run: |
          # NOTE: BUILD_TESTS is OFF on purpose. GitHub runners do not support
          # AVX-512, and CMake's gtest_discover_tests runs the test binary at
          # build time, which would SIGILL (Illegal instruction) here.
          cmake -S . -B ${{ inputs.build_dir || 'build' }} \
            -DCMAKE_BUILD_TYPE=${{ inputs.configuration || 'RelWithDebInfo' }} \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DBUILD_TESTS:BOOL=OFF \
            -DBUILD_BINARY:BOOL=ON \
            -DENABLE_AVX512=1 \
            -DUSE_SANITIZER=OFF \
            -DONLY_LOGGING=ON

      # Build the project
      - name: Build with Make
        run: cmake --build ${{ inputs.build_dir || 'build' }} --config ${{ inputs.configuration || 'RelWithDebInfo' }} -- -j$(nproc)

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QubicLiteLinuxBuild-AVX512-${{ inputs.configuration || 'RelWithDebInfo' }}
          path: |
            ${{ inputs.build_dir || 'build' }}